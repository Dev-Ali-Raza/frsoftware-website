  <body>
    <!--
      Hidden static form so Netlify's build-time bots can detect the
      contact form (the real form is rendered by React at runtime).
      Keep field names in sync with src/components/Contact.jsx.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <select name="service"></select>
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
